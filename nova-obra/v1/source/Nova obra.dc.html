<!DOCTYPE html>
<html>
<head>


<link rel="stylesheet" href="styles.css">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet>
  
  
  <style>
    html,body{margin:0;height:100%}
    a{color:var(--primary)}
    .es-back{display:inline-flex;align-items:center;gap:var(--space-1);min-height:var(--tap-min);padding-right:var(--space-2);margin-left:-6px;font-size:var(--text-sm);font-weight:500;color:var(--muted-foreground);text-decoration:none;background:none;border:0;cursor:pointer;font-family:inherit}
    .es-back:hover{color:var(--foreground)}
    .es-row{display:flex;align-items:center;gap:var(--space-2);min-height:56px;padding:0 var(--space-2) 0 var(--space-4);border-top:1px solid var(--border)}
    .es-row:first-child{border-top:0}
    .es-row__link{flex:1;min-width:0;display:grid;gap:2px;padding:var(--space-2) 0;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
    .es-row__link:disabled{cursor:default}
    .es-row__name{font-size:var(--text-base);font-weight:500;overflow-wrap:anywhere}
    .es-row__name--mono{font-family:var(--font-mono)}
    .es-row__meta{font-size:var(--text-sm);color:var(--muted-foreground)}
    .es-chip{display:inline-flex;align-items:center;justify-content:center;min-height:var(--tap-min);padding:0 var(--space-2);border-radius:var(--radius-md);border:1px solid var(--input);background:var(--card);color:var(--foreground);font-family:var(--font-mono);font-size:var(--text-sm);font-weight:500;cursor:pointer;min-width:0;flex:1 1 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background var(--dur-fast,120ms)}
    .es-chip:hover{background:var(--muted)}
    .es-chip--area{font-family:var(--font-sans);font-size:var(--text-xs);color:var(--muted-foreground);background:var(--muted);border-color:transparent}
    .es-chip--new{border-style:dashed;border-color:var(--primary);color:var(--primary)}
    .es-floor{display:inline-flex;align-items:center;min-height:var(--tap-min);padding:0 var(--space-2);border-radius:var(--radius-md);border:0;background:none;color:var(--muted-foreground);font:inherit;font-size:var(--text-sm);font-weight:600;cursor:pointer;text-align:left;white-space:nowrap}
    .es-floor:hover{background:var(--muted);color:var(--foreground)}
    .es-floor--num{font-family:var(--font-mono)}
    .es-tower{display:grid;align-content:start;gap:var(--space-4);text-align:left;padding:var(--space-5);border-radius:var(--radius-xl);background:var(--card);box-shadow:var(--ring-hairline);border:0;color:inherit;font:inherit;cursor:pointer;min-width:0}
    .es-tower:hover{box-shadow:var(--ring-hairline),var(--shadow-sm)}
    .es-tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 6px 0 12px;border-radius:999px;background:var(--muted);font-size:var(--text-sm);max-width:100%}
    .es-tag button{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:999px;border:0;background:none;color:var(--muted-foreground);cursor:pointer}
    .es-tag button:hover{background:var(--secondary);color:var(--foreground)}
    .es-select{height:var(--tap-min);border-radius:var(--radius-lg);border:1px solid var(--input);background:var(--background);color:var(--foreground);font:inherit;font-size:var(--text-base);padding:0 var(--space-3);min-width:0;width:100%}
    .es-step{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:999px;background:var(--accent);color:var(--accent-foreground);font-size:var(--text-xs);font-weight:700;flex:none}
    .es-radio{display:grid;grid-template-columns:20px minmax(0,1fr);gap:var(--space-3);align-items:start;min-height:var(--tap-min);padding:var(--space-2) 0;cursor:pointer}
    .es-radio input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--primary)}
    .es-link{display:inline-flex;align-items:center;min-height:var(--tap-min);margin-block:-12px;font-weight:500;color:inherit;text-decoration:underline;text-underline-offset:3px}
    .es-link:hover{text-decoration-thickness:2px}
    .es-link--primary{color:var(--primary)}
    .es-nav{display:flex;align-items:center;gap:var(--space-2);min-height:44px;padding:0 var(--space-3);border-radius:var(--radius-lg);font-size:var(--text-sm);font-weight:500;text-decoration:none}
    .no-chip{position:relative}
    .no-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-foreground);border-color:var(--primary)}
    .no-chip--marked{box-shadow:inset 0 0 0 2px var(--primary)}
    .no-chip--open{background:var(--accent);color:var(--accent-foreground);box-shadow:inset 0 0 0 2px var(--primary)}
    .no-toggle{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-min);padding:0 var(--space-3);border-radius:999px;border:1px solid var(--input);background:var(--background);color:var(--foreground);font:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer}
    .no-toggle:hover{background:var(--muted)}
    .no-toggle[aria-pressed="true"]{background:var(--accent);color:var(--accent-foreground);border-color:var(--primary)}
    .no-cell{min-width:0;display:grid;place-items:center;border:1px solid var(--input);background:var(--card);color:var(--foreground);font-family:var(--font-mono);overflow:hidden;cursor:pointer;padding:0;white-space:nowrap;text-overflow:ellipsis}
    .no-cell:hover{background:var(--muted)}
    .no-cell:focus-visible,.no-chip:focus-visible,.no-toggle:focus-visible,.no-opt:focus-visible{outline:none;box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 35%,transparent)}
    .no-cell--area{font-family:var(--font-sans);border-color:transparent;background:var(--muted);color:var(--muted-foreground)}
    .no-cell--new{border-style:dashed;border-color:var(--primary)}
    .no-cell--marked{box-shadow:inset 0 0 0 2px var(--primary);background:var(--accent);color:var(--accent-foreground)}
    .no-cell--open{box-shadow:inset 0 0 0 2px var(--primary);background:var(--accent);color:var(--accent-foreground)}
    .no-cell--conflict{border-color:var(--destructive);border-style:solid;box-shadow:inset 0 0 0 1px var(--destructive)}
    .no-combo{position:relative;flex:1;min-width:0}
    .no-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:25;margin:0;padding:4px;list-style:none;border-radius:var(--radius-lg);background:var(--popover);color:var(--popover-foreground);box-shadow:var(--ring-hairline),var(--shadow-md);display:grid;gap:2px;max-height:264px;overflow:auto}
    .no-opt{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);width:100%;min-height:var(--tap-min);padding:0 var(--space-3);border:0;border-radius:var(--radius-md);background:none;color:inherit;font:inherit;font-size:var(--text-base);text-align:left;cursor:pointer}
    .no-opt:hover,.no-opt[aria-selected="true"]{background:var(--muted)}
    .no-opt__hint{font-size:var(--text-sm);color:var(--muted-foreground)}
    .no-field-label{font-size:var(--text-sm);font-weight:500}
    .no-kv{display:grid;gap:var(--space-1);padding:var(--space-3) 0;border-top:1px solid var(--border)}
    .no-kv:first-child{border-top:0;padding-top:0}
    .no-kv__k{font-size:var(--text-sm);color:var(--muted-foreground)}
    .no-kv__v{font-size:var(--text-base);overflow-wrap:anywhere;text-wrap:pretty}
    .no-steplink{justify-self:start;display:inline-flex;align-items:center;gap:6px;min-height:var(--tap-min);margin-block:-8px -10px;padding:0;border:0;background:none;color:var(--primary);font:inherit;font-size:var(--text-sm);font-weight:500;cursor:pointer;text-align:left}
    .no-steplink:hover{text-decoration:underline;text-underline-offset:3px}
    .no-disc{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-2);min-height:56px;padding:0 var(--space-4);border-top:1px solid var(--border)}
    .no-disc:first-child{border-top:0}
    .no-disc .bp-checkbox{min-height:var(--tap-min)}
    .no-err{display:flex;gap:var(--space-2);align-items:flex-start;font-size:var(--text-sm);color:var(--destructive);line-height:var(--leading-normal);text-wrap:pretty}
    .no-ring-danger{box-shadow:inset 0 0 0 1px var(--destructive),var(--ring-hairline)!important}
    .no-highlight{animation:no-flash 1.6s var(--ease-out,ease-out) 1}
    @keyframes no-flash{0%{box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 45%,transparent),var(--ring-hairline)}100%{box-shadow:var(--ring-hairline)}}
    .no-m .bp-alert-dialog-root{justify-content:flex-end;align-items:stretch;padding:0}
    .no-m .bp-alert-dialog{width:auto;max-width:none;gap:var(--space-4);padding:var(--space-5) var(--page-pad) calc(var(--space-4) + env(safe-area-inset-bottom));border-radius:var(--radius-xl) var(--radius-xl) 0 0}
    .no-m .bp-alert-dialog__footer{flex-direction:column-reverse;justify-content:flex-start}
    .no-m .bp-alert-dialog__footer .bp-btn{width:100%;height:var(--control-h-lg)}
    .no-pick{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);width:100%;height:var(--tap-min);padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-lg);border:1px solid var(--input);background:var(--background);color:var(--foreground);font:inherit;font-size:var(--text-base);text-align:left;cursor:pointer;min-width:0}
    .no-pick:hover{background:var(--muted)}
    .no-pick:focus-visible{outline:none;border-color:var(--ring);box-shadow:var(--shadow-focus)}
    .no-pick--invalid{border-color:var(--destructive);box-shadow:0 0 0 3px color-mix(in oklch,var(--destructive) 25%,transparent)}
    .no-list__head{padding:var(--space-2) var(--space-3) var(--space-1);font-size:var(--text-xs);font-weight:600;color:var(--muted-foreground);white-space:nowrap}
    .no-list__sep{height:1px;margin:var(--space-1) 0;background:var(--border)}
    .no-opt--off{color:var(--muted-foreground);cursor:default}
    .no-opt--off:hover{background:none}
    .no-rooms{margin:0;padding:0;list-style:none;border-radius:var(--radius-lg);box-shadow:var(--ring-hairline);background:var(--card)}
    .no-rooms li{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);min-height:var(--tap-min);padding:0 var(--space-1) 0 var(--space-3);border-top:1px solid var(--border);font-size:var(--text-base)}
    .no-rooms li:first-child{border-top:0}
    .no-rooms--read li{padding:0 var(--space-3)}
    .no-aside-note{display:flex;gap:var(--space-2);align-items:flex-start;padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);background:var(--muted);font-size:var(--text-sm);color:var(--muted-foreground);line-height:var(--leading-normal);text-wrap:pretty}
    .no-aside > *{flex:none}
    .no-aside > .no-aside__grow{flex:1 1 auto;min-height:0}
    .no-scroll{scrollbar-width:thin;scrollbar-color:var(--input) transparent}
    .no-scroll::-webkit-scrollbar{width:8px}
    .no-scroll::-webkit-scrollbar-thumb{background:var(--input);border-radius:999px}
    .no-scroll::-webkit-scrollbar-track{background:transparent}
    .no-scrim{position:absolute;inset:-12px;z-index:5;border-radius:var(--radius-xl);background:var(--overlay);cursor:pointer}
    .no-panel{position:absolute;top:0;right:calc(100% + 24px);width:380px;max-height:var(--no-panel-max,calc(100dvh - 104px));display:flex;flex-direction:column;border-radius:var(--radius-xl);background:var(--popover);color:var(--popover-foreground);box-shadow:var(--ring-hairline),var(--shadow-lg);z-index:7}
    .no-disc-ro{display:grid;grid-template-columns:24px minmax(0,1fr);gap:var(--space-3);align-items:start;padding:var(--space-3) var(--space-4);border-top:1px solid var(--border)}
    .no-disc-ro:first-child{border-top:0}
    .no-roomgrid{margin:0;padding:0;list-style:none;display:grid;gap:1px;border-radius:var(--radius-lg);background:var(--border);box-shadow:var(--ring-hairline);overflow:hidden}
    .no-roomgrid li{display:flex;align-items:center;min-height:var(--tap-min);padding:var(--space-2) var(--space-3);background:var(--card);font-size:var(--text-base);overflow-wrap:anywhere}
  </style>
</helmet>
<div ref="{{ rootRef }}" class="{{ themeClass }}" style="position:relative; display:flex; flex-direction:column; height:{{ rootH }}; overflow:hidden; background:var(--background); color:var(--foreground); font-family:var(--font-sans)">
  <div ref="{{ scrollRef }}" style="flex:1; min-height:0; display:flex; flex-direction:column; overflow-y:auto; overflow-x:hidden; scrollbar-width:{{ scrollbarWidth }}">

    <header data-pin="h" style="position:{{ headerPos }}; top:0; z-index:30; background:var(--background); border-bottom:1px solid var(--border); padding-top:env(safe-area-inset-top)">
      <div style="max-width:var(--content-max-wide); margin:0 auto; height:{{ headerH }}; padding:0 {{ pad }}; display:flex; align-items:center; justify-content:space-between; gap:var(--space-3)">
        <a href="#" onClick="{{ goObras }}" aria-label="BluPrint, obras" style="display:flex; align-items:center; min-height:var(--tap-min)">
          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Logo" wordmark="{{ true }}" tone="{{ logoTone }}" size="{{ logoSize }}" hint-size="102px,28px"></x-import>
        </a>
        <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenu" trigger="{{ menuTrigger }}" open="{{ accountOpen }}" onOpenChange="{{ onMenuOpenChange }}" locked="{{ signingOut }}" align="end" width="{{ 312 }}" label="Conta" hint-size="44px,44px">
          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenuLabel" hint-size="100%,64px">
            <div style="display:flex; align-items:center; gap:var(--space-3); padding-block:var(--space-1)">
              <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Avatar" name="{{ user.name }}" size="lg" hint-size="48px,48px"></x-import>
              <div style="display:grid; gap:2px; min-width:0">
                <span style="font-size:var(--text-base); font-weight:600; line-height:var(--leading-snug)">{{ user.name }}</span>
                <span style="font-size:var(--text-sm); color:var(--muted-foreground); overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ user.email }}</span>
                <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ false }}">
                  <span style="font-size:var(--text-sm); color:var(--muted-foreground)">Admin da construtora</span>
                </sc-if>
              </div>
            </div>
          </x-import>
          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenuSeparator" hint-size="100%,9px"></x-import>
          <div style="display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:var(--tap-min); padding-left:var(--space-3)">
            <span>Tema</span>
            <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.SegmentedControl" size="sm" label="Tema" options="{{ themeOptions }}" value="{{ themeValue }}" onChange="{{ onTheme }}" hint-size="90px,36px"></x-import>
          </div>
          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenuSeparator" hint-size="100%,9px"></x-import>
          <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.DropdownMenuItem" icon="{{ logoutIcon }}" loading="{{ signingOut }}" keepOpen="{{ true }}" onSelect="{{ signOut }}" hint-size="100%,44px">Sair</x-import>
        </x-import>
      </div>
    </header>

    <sc-if value="{{ showBand }}" hint-placeholder-val="{{ true }}">
    <div data-pin="b" style="border-bottom:1px solid var(--border)">
      <div style="max-width:var(--content-max-wide); margin:0 auto; padding:{{ bandPad }}; display:grid; gap:var(--space-2)">
        <div style="display:flex; align-items:center; justify-content:space-between; gap:var(--space-3); min-height:var(--tap-min)">
          <button type="button" class="es-back" onClick="{{ goBack }}">
            <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Icon" name="chevron-left" size="{{ 20 }}" hint-size="20px,20px"></x-import>{{ backLabel }}
          </button>
          <sc-if value="{{ mobileAction }}" hint-placeholder-val="{{ false }}">
            <div>{{ mobileAction }}</div>
          </sc-if>
        </div>
        <sc-if value="{{ bandLoading }}" hint-placeholder-val="{{ false }}">
          <div aria-busy="true" aria-label="Carregando" style="display:grid; gap:var(--space-3); padding-block:4px">
            <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Skeleton" width="{{ headSkW }}" height="{{ headSkH }}" radius="md" hint-size="60%,28px"></x-import>
            <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Skeleton" width="{{ 180 }}" height="{{ 18 }}" radius="sm" hint-size="180px,18px"></x-import>
          </div>
        </sc-if>
        <sc-if value="{{ bandReady }}" hint-placeholder-val="{{ true }}">
          <div style="display:flex; align-items:flex-end; justify-content:space-between; gap:var(--space-4); flex-wrap:wrap">
            <div style="display:grid; gap:var(--space-2); min-width:0; flex:1 1 18rem">
              <h1 style="margin:0; font-size:{{ titleSize }}; font-weight:600; letter-spacing:var(--tracking-tight); line-height:var(--leading-tight); text-wrap:balance; overflow-wrap:anywhere; font-family:{{ titleFont }}">{{ title }}</h1>
              <div style="display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; font-size:var(--text-sm); color:var(--muted-foreground)">{{ meta }}</div>
            </div>
            <sc-if value="{{ deskActions }}" hint-placeholder-val="{{ false }}">
              <div style="display:flex; gap:var(--space-2); align-items:center">{{ deskActions }}</div>
            </sc-if>
          </div>
          <sc-if value="{{ lockLine }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex; align-items:center; gap:var(--space-2); font-size:var(--text-sm); color:var(--muted-foreground)">
              <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Icon" name="lock" size="{{ 16 }}" hint-size="16px,16px"></x-import>{{ lockLine }}
            </div>
          </sc-if>
        </sc-if>
      </div>
    </div>
    </sc-if>

    <main data-pin="m" style="width:100%; max-width:{{ mainMax }}; margin:0 auto; padding:{{ mainPad }}; display:grid; gap:{{ mainGap }}">
      {{ body }}
    </main>
    <sc-if value="{{ bottomBar }}" hint-placeholder-val="{{ false }}">
      <div style="position:sticky; bottom:0; z-index:20; margin-top:auto; background:var(--background); border-top:1px solid var(--border); padding:var(--space-3) var(--page-pad) calc(var(--space-3) + env(safe-area-inset-bottom))">{{ bottomBar }}</div>
    </sc-if>
  </div>

  <sc-if value="{{ overlay }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute; inset:0; z-index:45; display:flex; flex-direction:column; background:var(--background)">{{ overlay }}</div>
  </sc-if>
  <sc-if value="{{ dialogOpen }}" hint-placeholder-val="{{ false }}">
    <div class="bp-alert-dialog-root bp-alert-dialog-root--contained">
      <div class="bp-alert-dialog__scrim" onClick="{{ closeDialog }}"></div>
      <div role="{{ dialogRole }}" aria-modal="true" aria-label="{{ dialogTitle }}" class="bp-alert-dialog" style="max-width:{{ dialogMax }}">
        <h2 class="bp-alert-dialog__title">{{ dialogTitle }}</h2>
        <div class="bp-alert-dialog__body">{{ dialogBody }}</div>
        <footer class="bp-alert-dialog__footer">{{ dialogFooter }}</footer>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
    <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Toaster" contained="{{ true }}" position="{{ toastPos }}" offset="{{ toastOffset }}" hint-size="0px,0px">
      <x-import component-from-global-scope="BluPrintDesignSystem_d4fa62.Toast" tone="{{ toastTone }}" action="{{ toastAction }}" onDismiss="{{ dismissToast }}" hint-size="100%,64px">{{ toast }}</x-import>
    </x-import>
  </sc-if>
</div>

      if (e.tower && n.kind !== "tower") where.push(e.tower.name);
      if (e.floor && n.kind !== "floor") where.push(e.floor.name);
      if (n.kind === "tower") meta = h("span", null, ["Torre", plural(n.floors.length, "andar", "andares"), plural(n.floors.reduce((k, f) => k + f.units.length, 0), "unidade", "unidades")].join(" · "));
      else if (n.kind === "floor") meta = h("span", null, ["Andar", ...where, plural(n.units.length, "unidade", "unidades")].join(" · "));
      else if (n.kind === "unit") meta = h("span", null, ["Unidade", ...where].join(" · "));
      else meta = h("span", null, ["Área comum", ...(where.length ? where : ["da obra"])].join(" · "));
      if (canEdit && DS.Button) {
        pageMenu = this.menuEl("page", this.menuFor(n), this.dotsButton("Ações de " + n.name, true), "Ações de " + n.name);
        if (desk && n.kind === "tower") deskActions = h(React.Fragment, null, h(DS.Button, { variant: "outline", iconStart: this.ic("list-plus", 18), onClick: () => this.openWizard(true) }, "Adicionar andares"), pageMenu);
        else if (desk) deskActions = pageMenu;
        if (desk) pageMenu = null;
      }
    }

    let body = null;
    this.wizardBar = null; this.wizardOverlay = null;
    if (DS.Button) {
      if (scr === "new") body = this.newBody(desk);
      else if (scr === "home") body = this.homeBody(desk, canEdit);
      else if (wizardish && delivered) body = this.stateBlock("lock", "A obra foi entregue", "A estrutura não pode mais ser alterada. Dá para conferir tudo na fachada e na configuração.", h(DS.Button, { size: "lg", block: !desk, onClick: this.go("home") }, "Voltar para a obra"));
      else if (wizardish) body = this.wizardBody(desk);
      else if (scr === "configuration") body = this.configBody(desk, canEdit);
      else if (e && e.node.kind === "tower") body = this.towerBody(e.node, desk, canEdit);
      else if (e && e.node.kind === "floor") body = this.floorBody(e.node, desk, canEdit);
      else if (e) body = this.locBody(e, desk, canEdit);
    }
    const dp = DS.Button ? this.dialogParts(desk) : null;
    const tt = st.toast;
    return {
      rootRef: this.rootRef, scrollRef: this.scrollRef,
      themeClass: (dark ? "dark" : "") + (desk ? "" : " no-m"),
      rootH: this.props.framed ? "100%" : "100dvh",
      scrollbarWidth: desk ? "auto" : "none",
      headerPos: "relative",
      headerH: desk ? "64px" : "56px",
      pad: desk ? "var(--page-pad-desktop)" : "var(--page-pad)",
      logoTone: dark ? "white" : "gradient",
      logoSize: desk ? 32 : 28,
      user, isAdmin: role === "admin", menuTrigger,
      accountOpen: st.menu === "account", signingOut: false,
      onMenuOpenChange: v => this.setState({ menu: v ? "account" : null }),
      themeOptions: DS.Icon ? [{ value: "light", icon: h(DS.Icon, { name: "sun", size: 18 }), ariaLabel: "Tema claro" }, { value: "dark", icon: h(DS.Icon, { name: "moon", size: 18 }), ariaLabel: "Tema escuro" }] : [],
      themeValue: dark ? "dark" : "light",
      onTheme: v => this.setState({ dark: v === "dark" }),
      logoutIcon: DS.Icon ? h(DS.Icon, { name: "log-out", size: 20 }) : null,
      signOut: this.signOut, goObras: this.goObras,
      showBand: scr !== "new",
      bandPad: desk ? "var(--space-4) var(--page-pad-desktop) var(--space-6)" : "var(--space-1) var(--page-pad) var(--space-5)",
      backLabel, goBack,
      mobileAction: pageMenu,
      bandLoading: false, bandReady: true,
      headSkW: desk ? 280 : "50%", headSkH: desk ? 36 : 28,
      titleSize: desk ? "var(--text-3xl)" : "var(--text-2xl)", titleFont,
      title, meta, deskActions,
      lockLine: delivered && scr !== "configuration" && scr !== "new" ? DELIVERED_LOCK : null,
      mainMax: "var(--content-max-wide)",
      mainPad: scr === "new" ? (desk ? "var(--space-8) var(--page-pad-desktop) var(--space-12)" : "var(--space-2) var(--page-pad) var(--space-10)") : desk ? "var(--space-8) var(--page-pad-desktop) var(--space-12)" : "var(--space-5) var(--page-pad) var(--space-8)",
      mainGap: desk ? "var(--space-5)" : "var(--space-4)",
      body,
      bottomBar: wizardish && !desk && !delivered ? this.wizardBar : null,
      overlay: !desk && wizardish ? this.wizardOverlay : null,
      dialogTitle: dp ? dp.title : "", dialogRole: dp ? dp.role : "dialog", dialogBody: dp ? dp.body : null, dialogFooter: dp ? dp.footer : null,
      dialogOpen: !!dp, dialogMax: desk && dp ? dp.max : "none",
      closeDialog: () => this.setState({ dialog: null }),
      toast: tt && DS.Button ? (tt.action === "types" ? h("span", { style: { display: "grid", gap: "2px" } }, tt.text, h("a", { href: "#", className: "es-link es-link--primary", style: { justifySelf: "start", marginBlock: "-10px" }, onClick: ev => { this.noop(ev); this.enter("configuration", null, { cfgSection: "tipologias", highlight: "tipologias", toast: null }); this.scrollTo("tipologias"); } }, "Ver tipologias")) : tt.text) : null,
      toastTone: tt ? tt.tone : "default",
      toastAction: null,
      toastPos: desk ? "bottom-right" : "bottom-center",
      toastOffset: wizardish && !desk ? 88 : 0,
      dismissToast: () => this.setState({ toast: null }),
    };
  }
}
</script>
</body>
</html>
